<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070709" />
    <meta
      name="description"
      content="NOCTURNE 夜曲画廊：一座可以漫步的 3D 博客美术馆。文章如画作悬挂于长廊两侧，滚动漫游，点击阅读。"
    />
    <title>NOCTURNE · 夜曲画廊</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23070709'/%3E%3Ccircle cx='32' cy='32' r='16.5' fill='none' stroke='%23e8e2d4' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="alternate" type="application/rss+xml" title="NOCTURNE · 夜曲画廊" href="./feed.xml" />
    <style>
      /* 关键首屏样式：让加载屏在样式表就绪前即正确呈现 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070709;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070709;
        color: #e8e2d4;
        transition: opacity 0.95s ease;
      }
      #loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app" aria-label="3D 画廊"></div>

    <div id="loader" role="status">
      <div class="loader-inner">
        <div class="loader-brand">
          <span class="loader-en">NOCTURNE</span>
          <span class="loader-zh">夜 曲 画 廊</span>
        </div>
        <div class="loader-track"><div class="loader-bar"></div></div>
        <div class="loader-status">正在点亮灯光…</div>
      </div>
      <div class="loader-foot">A WALKABLE BLOG</div>
    </div>

    <noscript>
      <div
        style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #070709; color: #e8e2d4; font: 14px/1.8 sans-serif; text-align: center; padding: 24px;"
      >
        这座画廊需要 JavaScript 才能开门。<br />
        也可以直接阅读<a href="./archive.html" style="color: #e8e2d4">文字版归档</a>。
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
